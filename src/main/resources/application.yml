server:
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        name: DEMOSESSION
        http-only: true
        same-site: Strict
        secure: false   # true si usas HTTPS

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/taller1
    username: biblioteca_user
    password: biblioteca_pwd
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway har� el esquema
    open-in-view: false
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.springframework.security: INFO
    org.flywaydb: DEBUG
    com.zaxxer.hikari: DEBUG

app:
  jwt:
    secret: "h3s7C2T6wQJg9zqv0o2yYF9b3yK3s8r1bG4yS1p0V8qE5m2Zq6G2xw=="
    expiration-minutes: 60

