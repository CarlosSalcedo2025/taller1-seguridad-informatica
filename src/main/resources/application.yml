server:
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        name: DEMOSESSION
        http-only: true
        same-site: Strict
        secure: false # true si usas HTTPS

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/taller1
    username: postgres
    password: 123
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.springframework.security: INFO
    org.flywaydb: DEBUG
    com.zaxxer.hikari: DEBUG

application:
  security:
    jwt:
      # Cargar el secreto JWT desde la variable de entorno JWT_SECRET para evitar comprometer secretos en el repo.
      # Establece JWT_SECRET en tu entorno o usa un archivo local `.env` (que debe estar en .gitignore).
      secret-key: "iFGQ6M37noI1e3n6Z+CvDGziMUx4GVRekYKAZr/alu6699yIZG1RF7SRXN+R7FYJ1odiT7QIZDF+XqnM7mjgSg==" # valor por defecto (base64) para desarrollo
      expiration-minutes: 60 # 1 hora
      refresh-token:
        expiration-minutes: 1440 # 24 horas
